name: TraceFit CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.ref == 'refs/heads/develop' && 'develop' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  CI: true

jobs:

  GradleBuild:
    runs-on: macos-26
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@b4f70067782bc72102bf785bca1f519aa92e11cd

      - name: Assemble
        run: ./gradlew assemble

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Quality:
    runs-on: macos-26
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@b4f70067782bc72102bf785bca1f519aa92e11cd

      - name: Run Quality Jobs
        run: ./gradlew check koverXmlReport --parallel

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverageReport
          path: build/reports/kover/report.xml

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT


  Notify:
    runs-on: ubuntu-latest
    needs: [ GradleBuild, Quality]
    if: always()
    steps:

      - name: Notify slack fail
        if: false == (needs.GradleBuild.outputs.status == 'success') ||
          false == (needs.Quality.outputs.status == 'success')
        uses: voxmedia/github-action-slack-notify-build@v2
        with:
          channel: tracefit-github
          status: FAILED
          color: danger

  # Auto-approve Renovate PRs once CI passes — the needs edge is the "all green" gate; the shared
  # reusable does the code-owner approval. Replaces the old standalone renovate.yml.
  RenovateAutoApprove:
    needs: [ GradleBuild, Quality ]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.head_ref, 'major')
    uses: Oztechan/Global/.github/workflows/reusable-renovate-approve.yml@bd0bde4c7b7997d28bf6f29778b0f2f46cd5133f
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
