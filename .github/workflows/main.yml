name: TraceFit CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: ${{ github.ref == 'refs/heads/develop' && 'develop' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  CI: true

jobs:

  GradleBuild:
    runs-on: macos-26
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      - name: Assemble
        run: ./gradlew assemble

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT

  Quality:
    runs-on: macos-26
    outputs:
      status: ${{ steps.status.outputs.status }}
    steps:

      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169

      - name: Run Quality Jobs
        run: ./gradlew check koverXmlReport --parallel

      - name: Upload Coverage Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverageReport
          path: build/reports/kover/report.xml

      - name: Cancel other jobs if this fails
        if: failure()
        uses: andymckay/cancel-action@a955d435292c0d409d104b57d8e78435a93a6ef1 # 0.5

      - name: Set Job Status
        id: status
        run: echo "status=success" >> $GITHUB_OUTPUT


  Notify:
    runs-on: ubuntu-latest
    needs: [ GradleBuild, Quality]
    if: always()
    steps:

      - name: Notify slack fail
        if: false == (needs.GradleBuild.outputs.status == 'success') ||
          false == (needs.Quality.outputs.status == 'success')
        uses: voxmedia/github-action-slack-notify-build@373da97827332b19e753c84d1e5b7937dbe0fbfa # v2
        with:
          channel: tracefit-github
          status: FAILED
          color: danger

  # Auto-approve Renovate PRs once CI passes — the needs edge is the "all green" gate; the shared
  # reusable does the code-owner approval. Replaces the old standalone renovate.yml.
  RenovateAutoApprove:
    needs: [ GradleBuild, Quality ]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'renovate[bot]' &&
      !contains(github.head_ref, 'major')
    uses: Oztechan/Global/.github/workflows/reusable-renovate-approve.yml@d8b3e0c0daf818d599c0b068a95144207febdb22 # v1.0.169
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
