# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true
# Gradle
org.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx2G -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.configuration-cache=true
# Kotlin
kotlin.code.style=official
# Kotlin/Native release-framework LTO (devirtualization) is heap-heavy; give it more than the 4g default
kotlin.native.jvmArgs=-Xmx6g
kotlin.build.report.output=build_scan,file
kotlin.incremental=true
kotlin.incremental.native=true
# Compose
org.jetbrains.compose.experimental.uikit.enabled=true
# KMP
kotlin.incremental.multiplatform=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
